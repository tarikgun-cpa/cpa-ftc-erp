  window.islemDuzenleKaydet = async function() {
      const islemId = document.getElementById('hd_islemId').value;
      const bankaId = document.getElementById('hd_bankaId').value;
      const eskiCariId = document.getElementById('hd_eskiCari').value;
      const eskiTur = document.getElementById('hd_eskiTur').value;
      const eskiTutar = parseFloat(document.getElementById('hd_tutar').value);
      const eskiYon = document.getElementById('hd_tutar_gosterim').getAttribute('data-eski-yon');
      
      const yeniTur = document.getElementById('hd_tur').value;
      const yeniCariId = document.getElementById('hd_cariId').value;
      const yeniTutar = parseFloat(document.getElementById('hd_tutar_gosterim').value);

      if(isNaN(yeniTutar) || yeniTutar <= 0) { alert("Lütfen geçerli bir işlem tutarı girin."); return; }
      if(!yeniCariId) { alert("Lütfen bir eşleştirme seçin!"); return; }

      const btn = document.getElementById('btn_duzenle_kaydet');
      btn.disabled = true; btn.innerHTML = 'İşleniyor...';

      try {
          // 1. ESKİ CARİ VE BANKA BAKİYESİNİ GERİ AL
          let isOldSistem = eskiCariId.startsWith('SISTEM_') || eskiCariId === 'MUHTELIF_SATICI' || eskiCariId === 'VERGI_DAIRESI';
          if(!isOldSistem) {
              const eskiCariIade = eskiYon === 'Tahsilat' ? eskiTutar : -eskiTutar; 
              await updateDoc(doc(db, "cariler", eskiCariId), { bakiye: increment(eskiCariIade) });
          }
          const eskiBankaIade = eskiYon === 'Tahsilat' ? -eskiTutar : eskiTutar;
          await updateDoc(doc(db, "bankalar", bankaId), { bakiye: increment(eskiBankaIade) });

          const islem = islemListesi.find(i => i.id === islemId);
          let islemTarihi = islem.tarih ? new Date(islem.tarih.seconds * 1000) : new Date();
          let yeniYon = (['Tahsilat', 'Faiz_Gelir'].includes(yeniTur)) ? 'Tahsilat' : 'Odeme';

          // 2. YENİ CARİ VE BANKA BAKİYESİNİ UYGULA
          let isNewVirman = yeniCariId.startsWith('BANKA_');
          if (isNewVirman) {
              let karsiBankaId = yeniCariId.replace('BANKA_', '');
              await updateDoc(doc(db, "hesapHareketleri", islemId), {
                  cariId: 'SISTEM_VIRMAN', tur: yeniTur, tutar: yeniTutar, yon: yeniYon, aciklama: islem.aciklama + ' (Eşleştirildi)'
              });
              await addDoc(collection(db, "hesapHareketleri"), {
                  bankaId: karsiBankaId, cariId: 'SISTEM_VIRMAN', tur: yeniTur === 'Tahsilat' ? 'Odeme' : 'Tahsilat', yon: yeniTur === 'Tahsilat' ? 'Odeme' : 'Tahsilat', tutar: yeniTutar, aciklama: islem.aciklama + ' (Karşı Hesap)', tarih: islemTarihi
              });
              
              let karsiFark = yeniTur === 'Tahsilat' ? -yeniTutar : yeniTutar;
              await updateDoc(doc(db, "bankalar", karsiBankaId), { bakiye: increment(karsiFark) });
          } else {
              await updateDoc(doc(db, "hesapHareketleri", islemId), {
                  cariId: yeniCariId, tur: yeniTur, tutar: yeniTutar, yon: yeniYon
              });
              
              let isNewSistem = yeniCariId.startsWith('SISTEM_') || yeniCariId === 'MUHTELIF_SATICI' || yeniCariId === 'VERGI_DAIRESI';
              if(!isNewSistem) {
                  const yeniCariEtki = yeniYon === 'Tahsilat' ? -yeniTutar : yeniTutar;
                  await updateDoc(doc(db, "cariler", yeniCariId), { bakiye: increment(yeniCariEtki) });
              }
          }

          const yeniBankaEtki = yeniYon === 'Tahsilat' ? yeniTutar : -yeniTutar;
          await updateDoc(doc(db, "bankalar", bankaId), { bakiye: increment(yeniBankaEtki) });

          bootstrap.Modal.getInstance(document.getElementById('islemDuzenleModal')).hide();
          setTimeout(() => { 
              if(document.getElementById('banka_ekstre_alan') && !document.getElementById('banka_ekstre_alan').classList.contains('d-none')) {
                  window.bankaEkstreAc(bankaId, true); 
              } else { window.bankalariCiz(); }
          }, 300);
      } catch(e) { alert("Hata: " + e.message); } finally { btn.disabled = false; btn.innerHTML = 'Eşleştirmeyi Kaydet'; }
  };

  window.bankaSil = async function(id) {
      if(!confirm("Bu banka hesabını silmek istediğinize emin misiniz?")) return;
      try { await deleteDoc(doc(db, "bankalar", id)); } catch(e) { alert("Hata: " + e.message); }
  };

  window.islemSil = async function(islemId, cariId, bankaId, tur, islemTutari) {
      if(!confirm("Bu banka hareketini silmek istediğinize emin misiniz? İlgili hesap bakiyeleri otomatik olarak iade edilecektir.")) return;
      try {
          const islem = islemListesi.find(i => i.id === islemId);
          let gercekYon = islem.yon ? islem.yon : (['Tahsilat', 'Faiz_Gelir'].includes(islem.tur) ? 'Tahsilat' : 'Odeme');
          let tutar = Math.abs(parseFloat(islemTutari)); 
          
          // EĞER ÇİFT TARAFLI BİR İŞLEMSE KARŞI TUTARI DA BUL (Döviz için)
          let karsiTutar = tutar;
          let karsiIslem = null;
          if (cariId === 'SISTEM_VIRMAN') {
             // Bu işlemin aynısı olan ama diğer bankaya ait olan karşı kaydı bul
             karsiIslem = islemListesi.find(i => i.cariId === 'SISTEM_VIRMAN' && i.id !== islemId && Math.abs(i.hamTarih - islem.hamTarih) < 2000);
             if (karsiIslem) { karsiTutar = Math.abs(parseFloat(karsiIslem.tutar)); }
          }
          
          await deleteDoc(doc(db, "hesapHareketleri", islemId));

          const bankaFarki = gercekYon === 'Tahsilat' ? -tutar : tutar;
          const cariFarki = gercekYon === 'Tahsilat' ? karsiTutar : -karsiTutar;

          if (cariId.startsWith('BANKA_')) {
              let karsiBankaId = cariId.replace('BANKA_', '');
              await updateDoc(doc(db, "bankalar", karsiBankaId), { bakiye: increment(cariFarki) });
          } 
          else if (cariId === 'SISTEM_VIRMAN' && karsiIslem) {
              // Virman silindiğinde karşı bankanın da parasını iade et ve o kaydı da sil
              let digerYonu = karsiIslem.yon === 'Tahsilat' ? -karsiTutar : karsiTutar;
              await updateDoc(doc(db, "bankalar", karsiIslem.bankaId), { bakiye: increment(digerYonu) });
              await deleteDoc(doc(db, "hesapHareketleri", karsiIslem.id));
          }
          else if (!cariId.startsWith('SISTEM_') && cariId !== 'MUHTELIF_SATICI' && cariId !== 'VERGI_DAIRESI') {
              await updateDoc(doc(db, "cariler", cariId), { bakiye: increment(cariFarki) });
          }
          
          if(bankaId !== "KUR_FARKI") {
              await updateDoc(doc(db, "bankalar", bankaId), { bakiye: increment(bankaFarki) });
          }

          setTimeout(() => { 
              if(typeof window.bankaEkstreAc === 'function') {
                  window.bankaEkstreAc(bankaId, true); 
              } else {
                  document.getElementById('main-content').innerHTML = '<div class="alert alert-success mt-4">İşlem başarıyla silindi ve bakiyeler güncellendi. Lütfen Bankalar menüsüne dönün.</div>';
              }
          }, 300);
      } catch(e) { alert("Hata: " + e.message); }
  };

  window.bankaEkstreAc = async function(bankaId, reRender = false, sadeceEslesmeyenler = false) {
      const banka = bankaListesi.find(b => b.id === bankaId);
      let birim = banka.paraBirimi === 'USD' ? '$' : (banka.paraBirimi === 'TRY' ? '₺' : '€');
      
      let basTarih = reRender && document.getElementById('ex_banka_bas') ? document.getElementById('ex_banka_bas').value : '';
      let bitTarih = reRender && document.getElementById('ex_banka_bit') ? document.getElementById('ex_banka_bit').value : '';

      let tamHareketler = islemListesi.filter(i => i.bankaId === bankaId).map(i => {
          let dStr = i.tarih ? new Date(i.tarih.seconds * 1000).toISOString().split('T')[0] : '';
          return { ...i, tarihStr: dStr, hamTarih: new Date(dStr).getTime() };
      });
      tamHareketler.sort((a,b) => a.hamTarih - b.hamTarih); 
      
      if(!reRender && !sadeceEslesmeyenler) {

              let gercekYon = h.yon ? h.yon : (['Tahsilat', 'Faiz_Gelir'].includes(h.tur) ? 'Tahsilat' : 'Odeme');
              hesaplananBankaBakiye += (gercekYon === 'Tahsilat' ? h.tutar : -h.tutar); 
          });
          hesaplananBankaBakiye = parseFloat(hesaplananBankaBakiye.toFixed(2));
          let mevcutBankaBakiye = parseFloat((banka.bakiye || 0).toFixed(2));

          if(hesaplananBankaBakiye !== mevcutBankaBakiye) {

              <div class="d-flex align-items-center">

    <rect x="114" y="32" width="22" height="6" fill="#f39c12" />
    <text x="140" y="55" font-family="'Inter', sans-serif" font-size="62" font-weight="300" fill="#64748b" letter-spacing="-3">FTC</text>
    <text x="3" y="78" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#475569" letter-spacing="3.2">CERTIFIED PUBLIC ACCOUNTING</text>
    <text x="3" y="90" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#94a3b8" letter-spacing="3.2">FOREIGN TRADE CONSULTANCY</text>
</svg>
                  <div>
                      <h4 class="mb-0 text-dark fw-bold">${banka.hesapAdi}</h4>
                      <small class="text-muted">Banka/Kasa Ekstresi</small>
                      ${banka.tur === 'Banka' ? '<br><small class="text-muted d-block mt-1" style="font-size:11px;"><strong>IBAN:</strong> ' + (banka.iban || '-') + ' | <strong>Yerel Hesap:</strong> ' + (banka.yerelHesap || '-') + '</small>' : ''}
                  </div>
              </div>
              <div class="text-end"><h6 class="mb-0 text-muted small">Güncel Kapanış Bakiyesi</h6><h4 class="${banka.bakiye >= 0 ? 'text-success' : 'text-danger'} fw-bold mb-0">${banka.bakiye.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ${birim}</h4></div>
          </div>
          
          <div class="row mb-3 d-print-none bg-light p-2 rounded mx-0">
              <div class="col-md-3"><label class="small text-muted">Başlangıç Tarihi</label><input type="date" id="ex_banka_bas" class="form-control form-control-sm" value="${basTarih}"></div>
              <div class="col-md-3"><label class="small text-muted">Bitiş Tarihi</label><input type="date" id="ex_banka_bit" class="form-control form-control-sm" value="${bitTarih}"></div>
              <div class="col-md-3 d-flex align-items-end"><button class="btn btn-sm btn-primary w-100" onclick="bankaEkstreAc('${bankaId}', true)"><i class="fas fa-filter"></i> Tarihe Göre Filtrele</button></div>
              <div class="col-md-3 d-flex align-items-end"><button class="btn btn-sm btn-warning w-100 fw-bold" onclick="bankaEkstreAc('${bankaId}', true, true)"><i class="fas fa-exclamation-triangle"></i> Eşleşmeyenleri Göster</button></div>
          </div>

          <div class="table-responsive">
          <table class="table table-sm table-hover align-middle">
              <thead class="table-light text-muted small border-bottom border-dark border-2"><tr><th>Tarih</th><th>İşlem Yönü</th><th>Cari Unvan (Kime/Kimden)</th><th>Açıklama</th><th class="text-end">Giriş (+)</th><th class="text-end">Çıkış (-)</th><th class="text-end">Bakiye</th><th class="d-print-none text-center">Aksiyon</th></tr></thead>
              <tbody>`;
              
      if(tamHareketler.length === 0) { 
          html += `<tr><td colspan="8" class="text-center text-muted py-3">İşlem bulunamadı.</td></tr>`; 
      } else {
          let toplamGiris = 0; let toplamCikis = 0; let yuruyenBakiye = 0;
          let filtrelenenKayitSayisi = 0;

          tamHareketler.forEach(h => {
              let gercekYon = h.yon ? h.yon : (['Tahsilat', 'Faiz_Gelir'].includes(h.tur) ? 'Tahsilat' : 'Odeme');

              else if(h.cariId === "SISTEM_VIRMAN") cariAdi = "Virman / Kredi Kartı İşlemi";
              else if(h.cariId === "SISTEM_MAAS") cariAdi = "Personel Maaşı / Avans";
              else if(h.cariId === "SISTEM_BANKA") cariAdi = "Banka Masrafı / Komisyon";
              else if(h.cariId === "SISTEM_FAIZ") cariAdi = "Faiz Geliri";
              else if(h.cariId === "SISTEM_DOVIZ") cariAdi = "Döviz Alım / Satım";
              else if(h.cariId === "MUHTELIF_SATICI") cariAdi = "Fiş / Carisiz Harcama";
              else cariAdi = cariListesi.find(c => c.id === h.cariId)?.unvan || 'Silinmiş / Hatalı Cari';

              let girisStr = '-'; let cikisStr = '-';

              else { cikisStr = `${h.tutar.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ${birim}`; toplamCikis += h.tutar; }

  window.islemDuzenleAc = function(id) {
      const islem = islemListesi.find(i => i.id === id);
      if(!islem) return;
      
      // VİRMAN KİLİDİ KALDIRILDI! Artık her işlem düzenlenebilir.

      document.getElementById('hd_islemId').value = id;
      document.getElementById('hd_bankaId').value = islem.bankaId;
      document.getElementById('hd_eskiCari').value = islem.cariId;
      document.getElementById('hd_eskiTur').value = islem.tur;
      
      let tutarInput = document.getElementById('hd_tutar_gosterim');
      tutarInput.removeAttribute('readonly');
      tutarInput.removeAttribute('disabled');
      tutarInput.type = 'text'; 
      
      let gercekYon = islem.yon ? islem.yon : (['Tahsilat', 'Faiz_Gelir'].includes(islem.tur) ? 'Tahsilat' : 'Odeme');
      tutarInput.setAttribute('data-eski-yon', gercekYon);
      
      if(document.getElementById('hd_gercek_yon')) {
          document.getElementById('hd_gercek_yon').value = gercekYon;
      }

  window.islemDuzenleKaydet = async function() {
      const islemId = document.getElementById('hd_islemId').value;
      const bankaId = document.getElementById('hd_bankaId').value;
      const eskiCariId = document.getElementById('hd_eskiCari').value;
      const eskiTutar = parseFloat(document.getElementById('hd_tutar').value);
      const eskiYon = document.getElementById('hd_tutar_gosterim').getAttribute('data-eski-yon'); // Her zaman orijinal Excel yönü
      
      const yeniTur = document.getElementById('hd_tur').value;
      const yeniCariId = document.getElementById('hd_cariId').value;
      
      let yeniTutarStr = document.getElementById('hd_tutar_gosterim').value;
      if(typeof yeniTutarStr === 'string') { yeniTutarStr = yeniTutarStr.replace(/\./g, '').replace(',', '.'); }
      const yeniTutar = parseFloat(yeniTutarStr);

      if(isNaN(yeniTutar) || yeniTutar <= 0) { alert("Lütfen geçerli bir işlem tutarı girin."); return; }
      if(!yeniCariId) { alert("Lütfen bir eşleştirme seçin!"); return; }

      const btn = document.getElementById('btn_duzenle_kaydet');
      btn.disabled = true; btn.innerHTML = 'İşleniyor...';

      try {
          // 1. ESKİ CARİ VE BANKA BAKİYESİNİ GERİ AL (REVERT)
          let isOldSistem = eskiCariId.startsWith('SISTEM_') || eskiCariId === 'MUHTELIF_SATICI' || eskiCariId === 'VERGI_DAIRESI';
          if(!isOldSistem) {
              const eskiCariIade = eskiYon === 'Tahsilat' ? eskiTutar : -eskiTutar; 
              await updateDoc(doc(db, "cariler", eskiCariId), { bakiye: increment(eskiCariIade) });
          }
          const eskiBankaIade = eskiYon === 'Tahsilat' ? -eskiTutar : eskiTutar;
          await updateDoc(doc(db, "bankalar", bankaId), { bakiye: increment(eskiBankaIade) });

          const islem = islemListesi.find(i => i.id === islemId);
          let islemTarihi = islem.tarih ? new Date(islem.tarih.seconds * 1000) : new Date();

          // Banka ekstresi yönünü zorla koruyoruz. (Ortak işlemi de olsa, eğer girişse girmiştir, çıkışsa çıkmıştır)
          let yeniYon = eskiYon; 

          // 2. YENİ CARİ VE BANKA BAKİYESİNİ UYGULA
          let isNewVirman = yeniCariId.startsWith('BANKA_');
          if (isNewVirman) {
              let karsiBankaId = yeniCariId.replace('BANKA_', '');
              
              await updateDoc(doc(db, "hesapHareketleri", islemId), {
                  cariId: 'SISTEM_VIRMAN', tur: yeniTur, tutar: yeniTutar, yon: yeniYon, aciklama: islem.aciklama + ' (Eşleştirildi)'
              });
              await addDoc(collection(db, "hesapHareketleri"), {
                  bankaId: karsiBankaId, cariId: 'SISTEM_VIRMAN', tur: yeniTur, yon: yeniYon === 'Tahsilat' ? 'Odeme' : 'Tahsilat', tutar: yeniTutar, aciklama: islem.aciklama + ' (Karşı Hesap)', tarih: islemTarihi
              });
              
              let karsiFark = yeniYon === 'Tahsilat' ? -yeniTutar : yeniTutar;
              await updateDoc(doc(db, "bankalar", karsiBankaId), { bakiye: increment(karsiFark) });
          } else {
              await updateDoc(doc(db, "hesapHareketleri", islemId), {
                  cariId: yeniCariId, tur: yeniTur, tutar: yeniTutar, yon: yeniYon
              });
              
              let isNewSistem = yeniCariId.startsWith('SISTEM_') || yeniCariId === 'MUHTELIF_SATICI' || yeniCariId === 'VERGI_DAIRESI';
              if(!isNewSistem) {
                  const yeniCariEtki = yeniYon === 'Tahsilat' ? -yeniTutar : yeniTutar;
                  await updateDoc(doc(db, "cariler", yeniCariId), { bakiye: increment(yeniCariEtki) });
              }
          }

          const yeniBankaEtki = yeniYon === 'Tahsilat' ? yeniTutar : -yeniTutar;
          await updateDoc(doc(db, "bankalar", bankaId), { bakiye: increment(yeniBankaEtki) });

          bootstrap.Modal.getInstance(document.getElementById('islemDuzenleModal')).hide();
          setTimeout(() => { 
              if(document.getElementById('banka_ekstre_alan') && !document.getElementById('banka_ekstre_alan').classList.contains('d-none')) {
                  window.bankaEkstreAc(bankaId, true); 
              } else { window.bankalariCiz(); }
          }, 300);
      } catch(e) { alert("Hata: " + e.message); } finally { btn.disabled = false; btn.innerHTML = 'Eşleştirmeyi Kaydet'; }
  };

  window.bankaExcelOku = function() {
      const bankaId = document.getElementById('ex_banka_secim').value;
      const fileInput = document.getElementById('banka_excel_dosya');
      if(!bankaId) { alert("Lütfen işlemlerin işleneceği banka/kasa hesabını seçin."); return; }
      if(fileInput.files.length === 0) { alert("Lütfen bir excel dosyası seçin."); return; }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
          try {
              const data = new Uint8Array(e.target.result);
              const workbook = XLSX.read(data, {type: 'array', cellDates: true});
              const sheet = workbook.Sheets[workbook.SheetNames[0]];
              
              let rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
              let headerRowIndex = -1;
              // Enpara ekstrelerinde başlıklar aşağıda olabiliyor, 40 satıra kadar taratıyoruz.
              for(let i = 0; i < Math.min(40, rawRows.length); i++) {
                  let rowText = rawRows[i] ? rawRows[i].join(' ') : '';
                  if(rowText.includes('İşlem Tutarı') || rowText.includes('Tutar') || rowText.includes('Tarih')) {
                      headerRowIndex = i; break;
                  }
              }

              let rows = [];
              if(headerRowIndex !== -1) {
                  rows = XLSX.utils.sheet_to_json(sheet, { range: headerRowIndex });
              } else {
                  rows = XLSX.utils.sheet_to_json(sheet); 
              }

              excelOkunanHareketler = [];
              const tbody = document.getElementById('excel_hareketler_tablosu');
              tbody.innerHTML = '';

              let cariOptionsHtml = '<option value="">-- LÜTFEN EŞLEŞTİRME SEÇİNİZ --</option>';
              cariOptionsHtml += '<option value="SISTEM_ESLESMEYEN" class="text-warning fw-bold">⚠️ EŞLEŞTİRME BEKLİYOR</option>';
              
              cariOptionsHtml += '<optgroup label="Banka, Kasa ve Kredi Kartları (Virman / Kart Ödemesi İçin)">';
              bankaListesi.forEach(b => {
                  if(b.id !== bankaId) { 
                      cariOptionsHtml += `<option value="BANKA_${b.id}">${b.hesapAdi} (${b.paraBirimi})</option>`;
                  }
              });
              cariOptionsHtml += '</optgroup>';

              cariOptionsHtml += '<optgroup label="Kayıtlı Cari Hesaplar (Müşteri, Tedarikçi, Ortak, Personel)">';
              cariListesi.forEach(c => {
                  let tip = c.grup === 'Alici' ? 'Müşteri' : (c.grup === 'Satici' ? 'Tedarikçi' : 'Ortak');
                  cariOptionsHtml += `<option value="${c.id}">${c.unvan} (${tip})</option>`;
              });
              cariOptionsHtml += '</optgroup>';

              cariOptionsHtml += '<optgroup label="Sistemsel Giderler ve İşlemler (Carisiz)">';
              cariOptionsHtml += '<option value="MUHTELIF_SATICI">-- Fiş / Carisiz Harcama --</option>';
              cariOptionsHtml += '<option value="SISTEM_VERGI">-- Vergi / SGK Ödemesi --</option>';
              cariOptionsHtml += '<option value="SISTEM_MAAS">-- Personel Maaşı (Carisiz) --</option>';
              cariOptionsHtml += '<option value="SISTEM_BANKA">-- Banka Masrafı / Komisyon / Faiz Gideri --</option>';
              cariOptionsHtml += '<option value="SISTEM_FAIZ">-- Faiz Geliri --</option>';
              cariOptionsHtml += '<option value="SISTEM_DOVIZ">-- Döviz Alım / Satım --</option>';
              cariOptionsHtml += '</optgroup>';

              rows.forEach((r, index) => {
                  let tarih = r['Tarih'] || r['İşlem Tarihi'] || '';
                  let aciklama = String(r['Açıklama'] || r['İşlem Açıklaması'] || '').trim();
                  let hareketTipi = String(r['Hareket tipi'] || r['İşlem Tipi'] || '').trim();
                  
                  let rawTutar = r['İşlem Tutarı (TL)'] || r['İşlem Tutarı'] || r['Tutar'] || r['Tutar (TL)'] || r['Alacak'] || r['Borç'];
                  if (rawTutar === undefined || rawTutar === null) rawTutar = 0;
                  
                  // ENPARA DÜZELTMESİ: Gizli boşlukları, &nbsp;, "TL" ve harfleri tamamen temizle
                  let tutarStr = String(rawTutar).trim();
                  tutarStr = tutarStr.replace(/[\s\xA0]/g, '').replace(/[a-zA-Z]/g, '').replace(/₺/g, '');
                  
                  // Türkiye standardı 1.250,50 -> 1250.50 dönüşümü
                  if(tutarStr.includes(',') && tutarStr.includes('.')) {
                      let lastComma = tutarStr.lastIndexOf(',');
                      let lastDot = tutarStr.lastIndexOf('.');
                      if(lastComma > lastDot) {
                          // Virgül ondalık ise: 1.250,50
                          tutarStr = tutarStr.replace(/\./g, '').replace(',', '.');
                      } else {
                          // Nokta ondalık ise (İngiliz standardı): 1,250.50
                          tutarStr = tutarStr.replace(/,/g, '');
                      }
                  } else if(tutarStr.includes(',')) {
                      // Sadece virgül varsa: 150,50
                      tutarStr = tutarStr.replace(',', '.');
                  }
                  
                  let tutar = parseFloat(tutarStr);
                  if (isNaN(tutar)) tutar = 0; // Tutar hesaplanamasa bile SATIRI SİLME, kullanıcı ekranda görsün.
                  if (!aciklama && tutar === 0) return; // Sadece tamamen boş satırları atla

                  let dStr = new Date().toISOString().split('T')[0];
                  if(tarih instanceof Date) {
                      dStr = tarih.toISOString().split('T')[0];
                  } else if(typeof tarih === 'string') {
                      let tP = tarih.split('/');
                      if(tP.length === 3) dStr = `${tP[2]}-${tP[1]}-${tP[0]}`;
                      else dStr = tarih;
                  }

                  let rawTipLower = String(hareketTipi).toLocaleLowerCase('tr-TR');
                  let anaYon = tutar >= 0 ? 'Tahsilat' : 'Odeme'; 
                  if (tutar < 0 || rawTipLower.includes('gider') || rawTipLower.includes('cikis') || rawTipLower.includes('çıkış') || rawTipLower.includes('borc') || rawTipLower.includes('borç') || rawTipLower.includes('ödenen')) {
                      anaYon = 'Odeme'; 
                  } else if (tutar > 0 || rawTipLower.includes('gelir') || rawTipLower.includes('giris') || rawTipLower.includes('giriş') || rawTipLower.includes('alacak')) {
                      anaYon = 'Tahsilat'; 
                  }

                  let mutlakTutar = Math.abs(tutar);
                  let eslesenCariId = '';
                  let islemTuruOto = anaYon;

                  let normalizeString = (str) => {
                      return String(str || '').toLocaleLowerCase('tr-TR')
                          .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's')
                          .replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c')
                          .replace(/[^a-z0-9\s]/g, ''); 
                  };

                  let aciklamaNorm = normalizeString(aciklama);
                  let aciklamaKelimeleri = aciklamaNorm.split(' ').filter(w => w.length > 2);
                  let tipNorm = normalizeString(hareketTipi);

                  // 0. ADIM: KULLANICI ÖZEL EŞLEŞTİRME KURALLARI (EN YÜKSEK ÖNCELİK)
                  if(typeof ozelKurallar !== 'undefined' && ozelKurallar.length > 0) {
                      for (let kural of ozelKurallar) {
                          let kuralKelimeNorm = normalizeString(kural.kelime);
                          if(aciklamaNorm.includes(kuralKelimeNorm)) {
                              eslesenCariId = kural.cariId;
                              islemTuruOto = kural.islemTuru;
                              break;
                          }
                      }
                  }

                  // 1. ADIM: BANKA VE KARTLARA BAK (VİRMAN İÇİN)
                  if(!eslesenCariId) {
                      let bankaYasakli = ['kredi', 'karti', 'hesabi', 'sirket', 'sirketi', 'sirketim', 'tl', 'usd', 'eur', 'bankasi', 'bank'];
                      for (let b of bankaListesi) {
                          if (b.id !== bankaId) {
                              let bNorm = normalizeString(b.hesapAdi);
                              if (aciklamaNorm.includes(bNorm) || aciklamaNorm.replace(/\s/g, '').includes(bNorm.replace(/\s/g, ''))) {
                                  eslesenCariId = 'BANKA_' + b.id;
                                  islemTuruOto = b.tur === 'Kredi Karti' ? 'Kredi_Karti_Odeme' : 'Virman';
                                  break;
                              }
                              let bKelimeleri = bNorm.split(' ').filter(w => w.length > 2 && !bankaYasakli.includes(w));
                              if (bKelimeleri.length > 0) {
                                  let eslesenBankaKelimesi = 0;
                                  for(let bw of bKelimeleri) {
                                      if (aciklamaNorm.includes(bw)) eslesenBankaKelimesi++;
                                  }
                                  if (eslesenBankaKelimesi === bKelimeleri.length) { 
                                      eslesenCariId = 'BANKA_' + b.id;
                                      islemTuruOto = b.tur === 'Kredi Karti' ? 'Kredi_Karti_Odeme' : 'Virman';
                                      break;
                                  }
                              }
                          }
                      }
                  }

                  // 2. ADIM: SİZİN AÇTIĞINIZ GERÇEK CARİ KARTLARA BAK
                  if (!eslesenCariId) {
                      let siraliCari = [...cariListesi].sort((a,b) => b.unvan.length - a.unvan.length);
                      let yasakli = ['as', 'ltd', 'sti', 'sanayi', 'ticaret', 'pazarlama', 'grup', 'san', 'tic', 've', 'anonim', 'sirketi', 'insaat', 'lojistik', 'hizmetleri', 'mimarlik', 'otomotiv', 'kardesler', 'dayanikli', 'tuketim', 'mallari', 'tasimacilik', 'nakliyat', 'ortak', 'ortagi', 'personel', 'maasi'];
                      
                      for(let c of siraliCari) {
                          let cariNorm = normalizeString(c.unvan);
                          let cariKelimeleri = cariNorm.split(' ').filter(w => w.length > 2 && !yasakli.includes(w));
                          
                          if(aciklamaNorm.includes(cariNorm) || aciklamaNorm.replace(/\s/g,'').includes(cariNorm.replace(/\s/g,''))) {
                              eslesenCariId = c.id; 
                              if (c.grup === 'Ortak') islemTuruOto = 'Ortak_Borc_Alacak';
                              if (cariNorm.includes('maas') || cariNorm.includes('personel')) islemTuruOto = 'Maas';
                              break;
                          }
                          
                          if (cariKelimeleri.length > 0) {
                              let eslesenKelimeSayisi = 0;
                              for(let cw of cariKelimeleri) {
                                  if(aciklamaKelimeleri.includes(cw) || aciklamaNorm.includes(cw)) {
                                      eslesenKelimeSayisi++;
                                  }
                              }
                              if(eslesenKelimeSayisi > 0 && eslesenKelimeSayisi >= Math.ceil(cariKelimeleri.length / 2)) {
                                  eslesenCariId = c.id; 
                                  if (c.grup === 'Ortak') islemTuruOto = 'Ortak_Borc_Alacak';
                                  if (cariNorm.includes('maas') || cariNorm.includes('personel')) islemTuruOto = 'Maas';
                                  break;
                              }
                          }
                      }
                  }

                  // 3. ADIM: SİSTEMSEL JENERİK KONTROLLER VE BEKLEYENLER
                  if (!eslesenCariId) {
                      if(aciklamaNorm.includes('vergi') || aciklamaNorm.includes('sgk') || aciklamaNorm.includes('muhtasar')) { 
                          islemTuruOto = 'Vergi_SGK'; eslesenCariId = 'SISTEM_VERGI'; 
                      }
                      else if(aciklamaNorm.includes('maas') || tipNorm.includes('maas') || aciklamaNorm.includes('avans') || aciklamaNorm.includes('personel')) { 
                          islemTuruOto = 'Maas'; eslesenCariId = 'SISTEM_MAAS'; // Personel cari kartı yoksa sisteme atar
                      }
                      else if(aciklamaNorm.includes('faiz')) { 
                          if(anaYon === 'Tahsilat') { islemTuruOto = 'Faiz_Gelir'; eslesenCariId = 'SISTEM_FAIZ'; }
                          else { islemTuruOto = 'Banka_Gider'; eslesenCariId = 'SISTEM_BANKA'; }
                      }
                      else if((aciklamaNorm.includes('masraf') || aciklamaNorm.includes('komisyon') || aciklamaNorm.includes('eft ucreti') || aciklamaNorm.includes('havale ucreti')) && anaYon === 'Odeme') { 
                          islemTuruOto = 'Banka_Gider'; eslesenCariId = 'SISTEM_BANKA';
                      }
                      else if(aciklamaNorm.includes('kredi karti odemesi') || tipNorm.includes('kart odeme')) { 
                          islemTuruOto = 'Kredi_Karti_Odeme'; 
                      }
                      else if(aciklamaNorm.includes('doviz alis') || aciklamaNorm.includes('doviz satis') || tipNorm.includes('doviz')) { 
                          islemTuruOto = 'Doviz_Alim_Satis'; eslesenCariId = 'SISTEM_DOVIZ';
                      }
                      else if(aciklamaNorm.includes('ortaga borc') || aciklamaNorm.includes('ortaktan')) { 
                          islemTuruOto = 'Ortak_Borc_Alacak'; 
                      }
                      else if(aciklamaNorm.includes('virman')) { 
                          islemTuruOto = 'Virman'; 
                      } 
                      else {
                          eslesenCariId = 'SISTEM_ESLESMEYEN'; // Hiçbiri değilse "Eşleştirme Bekliyor" olarak kaydeder.
                      }
                  }

                  excelOkunanHareketler.push({
                      index: index,
                      tarih: dStr,
                      aciklama: aciklama,
                      tutar: mutlakTutar,
                      tur: islemTuruOto,
                      bankaId: bankaId,
                      eslesenId: eslesenCariId,
                      anaYon: anaYon // Yön hatasını engellemek için kaydedilir
                  });

                  let rowColor = anaYon === 'Tahsilat' ? 'text-success' : 'text-danger';
                  let statusIcon = (eslesenCariId && eslesenCariId !== 'SISTEM_ESLESMEYEN') ? '<i class="fas fa-check-circle text-success" title="Eşleşti"></i>' : '<i class="fas fa-exclamation-circle text-warning" title="Eşleşmedi"></i>';
                  let bgColor = (eslesenCariId && eslesenCariId !== 'SISTEM_ESLESMEYEN') ? '' : 'bg-warning bg-opacity-10';

                  let turSelectHtml = `
                      <select class="form-select form-select-sm border-0 bg-transparent text-secondary mb-1" id="ex_tur_${index}" style="font-size: 0.7rem; padding: 0;">
                          <option value="Tahsilat">Müşteriden Tahsilat</option>
                          <option value="Odeme">Tedarikçiye Ödeme</option>
                          <option value="Virman">Banka/Kasa Virman</option>
                          <option value="Kredi_Karti_Odeme">Kredi Kartı Borç Ödemesi</option>
                          <option value="Doviz_Alim_Satis">Döviz İşlemi</option>
                          <option value="Maas">Maaş Ödemesi</option>
                          <option value="Vergi_SGK">Vergi / SGK</option>
                          <option value="Ortak_Borc_Alacak">Ortak İşlemi</option>
                          <option value="Faiz_Gelir">Faiz Geliri</option>
                          <option value="Banka_Gider">Banka Masrafı</option>
                      </select>
                  `;

                  tbody.innerHTML += `
                      <tr id="ex_row_${index}" class="${bgColor}">
                          <td class="text-center">${statusIcon}</td>
                          <td>${dStr}</td>
                          <td class="text-wrap" style="max-width: 300px;"><small>${aciklama}</small></td>
                          <td class="fw-bold ${rowColor}">${anaYon === 'Tahsilat' ? '+' : '-'}${mutlakTutar.toLocaleString('tr-TR', {minimumFractionDigits: 2})}</td>
                          <td>
                              ${turSelectHtml}
                              <select class="form-select form-select-sm border-secondary cari-secici" id="ex_cari_${index}">
                                  ${cariOptionsHtml}
                              </select>
                          </td>
                      </tr>
                  `;
              });

              // Selectleri güncel değerlere set et
              excelOkunanHareketler.forEach(h => {
                  let cariSelect = document.getElementById(`ex_cari_${h.index}`);
                  let turSelect = document.getElementById(`ex_tur_${h.index}`);
                  if(h.eslesenId) cariSelect.value = h.eslesenId;
                  if(h.tur) turSelect.value = h.tur;
              });

              document.getElementById('excel_eslestirme_alani').classList.remove('d-none');
              document.getElementById('excel_kaydet_btn').classList.remove('d-none');

          } catch(err) {
              alert("Dosya okunamadı. Enpara veya standart banka formatında olduğundan emin olun. Detay: " + err.message);
              console.error(err);
          }
      };
      reader.readAsArrayBuffer(file);
  };
  window.bankaEkstreTopluKaydet = async function() {
      const btn = document.getElementById('excel_kaydet_btn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Kaydediliyor...'; btn.disabled = true;
      
      let islenenSayi = 0;
      let atlananSayi = 0;
      let ogrenilenKuralSayisi = 0;

      for (let h of excelOkunanHareketler) {
          let secimId = document.getElementById(`ex_cari_${h.index}`).value;
          let islemTuru = document.getElementById(`ex_tur_${h.index}`).value;
          
          if(!secimId || secimId === '') { secimId = 'SISTEM_ESLESMEYEN'; }

          try {
              // MANUEL SEÇİMLERİ YAPAY ZEKA GİBİ KURALLARA ÖĞRET (OTO KURAL)
              if(h.eslesenId === 'SISTEM_ESLESMEYEN' && secimId !== 'SISTEM_ESLESMEYEN') {
                  let kelimeOnerisi = h.aciklama.trim().split(/\s+/).slice(0, 2).join(' '); 
                  if(kelimeOnerisi.length > 3) {
                      let kurallarArray = (typeof ozelKurallar !== 'undefined' ? ozelKurallar : []);
                      let kuralVarMi = kurallarArray.some(k => k.kelime.toLowerCase() === kelimeOnerisi.toLowerCase());
                      if(!kuralVarMi) {
                          kurallarArray.push({ kelime: kelimeOnerisi, islemTuru: islemTuru, cariId: secimId });
                          await setDoc(doc(db, "ayarlar", "kurallar"), { liste: kurallarArray });
                          ogrenilenKuralSayisi++;
                      }
                  }
              }

              let gercekYon = h.anaYon; 
              
              if(secimId.startsWith('BANKA_')) {
                  // VİRMAN VE KART ÖDEMELERİ
                  let karsiBankaId = secimId.replace('BANKA_', '');
                  
                  let bankaFarki = gercekYon === 'Tahsilat' ? h.tutar : -h.tutar;
                  let karsiFark = gercekYon === 'Tahsilat' ? -h.tutar : h.tutar;
                  
                  await addDoc(collection(db, "hesapHareketleri"), {
                      bankaId: h.bankaId, cariId: 'SISTEM_VIRMAN', tur: islemTuru, yon: gercekYon, tutar: h.tutar, aciklama: h.aciklama + ' (İşlem Yapan)', tarih: new Date(h.tarih)
                  });
                  await addDoc(collection(db, "hesapHareketleri"), {
                      bankaId: karsiBankaId, cariId: 'SISTEM_VIRMAN', tur: islemTuru === 'Tahsilat' ? 'Odeme' : 'Tahsilat', yon: gercekYon === 'Tahsilat' ? 'Odeme' : 'Tahsilat', tutar: h.tutar, aciklama: h.aciklama + ' (Karşı Hesap)', tarih: new Date(h.tarih)
                  });
                  
                  await updateDoc(doc(db, "bankalar", h.bankaId), { bakiye: increment(bankaFarki) });
                  await updateDoc(doc(db, "bankalar", karsiBankaId), { bakiye: increment(karsiFark) });
                  
              } else {
                  // NORMAL CARİ VEYA SİSTEMSEL VEYA EŞLEŞMEYENLER
                  await addDoc(collection(db, "hesapHareketleri"), {
                      bankaId: h.bankaId, cariId: secimId, tur: islemTuru, yon: gercekYon, tutar: h.tutar, aciklama: h.aciklama, tarih: new Date(h.tarih) 
                  });

                  // Cari Bakiyesini Güncelle
                  let isSistemCard = secimId.startsWith('SISTEM_') || secimId === 'MUHTELIF_SATICI';
                  if(!isSistemCard && (islemTuru === 'Tahsilat' || islemTuru === 'Odeme' || islemTuru === 'Ortak_Borc_Alacak')) {
                      const cariBakiyeDegisimi = gercekYon === 'Tahsilat' ? -h.tutar : h.tutar;
                      await updateDoc(doc(db, "cariler", secimId), { bakiye: increment(cariBakiyeDegisimi) });
                  }

                  // Banka Bakiyesini Güncelle (Eşleşmeyen de olsa bankadan para çıktı!)
                  let bankaBakiyeDegisimi = gercekYon === 'Tahsilat' ? h.tutar : -h.tutar;
                  await updateDoc(doc(db, "bankalar", h.bankaId), { bakiye: increment(bankaBakiyeDegisimi) });
              }
              
              if(secimId === 'SISTEM_ESLESMEYEN') {
                  document.getElementById(`ex_row_${h.index}`).classList.replace('bg-warning', 'bg-danger');
                  atlananSayi++;
              } else {
                  document.getElementById(`ex_row_${h.index}`).classList.remove('bg-warning', 'bg-opacity-10', 'bg-danger');
                  document.getElementById(`ex_row_${h.index}`).classList.add('table-success');
              }
              
              h.eslesenId = null;
              islenenSayi++;
          } catch(err) {
              console.error(err);
          }
      }

      alert(`Toplu İşlem Tamamlandı!\nBankaya Aktarılan Toplam Kayıt: ${islenenSayi}\nEşleşmeyen (Ekstreden Değiştirilecek): ${atlananSayi}\nYeni Öğrenilen Oto-Kural: ${ogrenilenKuralSayisi}`);
      btn.innerHTML = '<i class="fas fa-save me-1"></i> Eşleşenleri Sisteme Kaydet'; btn.disabled = false;
      bootstrap.Modal.getInstance(document.getElementById('bankaExcelModal')).hide();
      window.bankaEkstreAc(document.getElementById('ex_banka_secim').value, true);
  };

  // ---------------- VERGİ VE YASAL ÖDEME İŞLEMLERİ ----------------
  window.vergileriCiz = function() {
      const bTbody = document.getElementById('bekleyenVergiTabloGövdesi');
      const oTbody = document.getElementById('odenenVergiTabloGövdesi');
      if (!bTbody || !oTbody) return; 
      
      bTbody.innerHTML = ""; oTbody.innerHTML = "";

      vergiListesi.forEach(vergi => {
          if(vergi.durum === 'Bekliyor') {
              let bugun = new Date();
              let sonG = new Date(vergi.sonTarih);
              let farkGun = Math.ceil((sonG - bugun) / (1000 * 60 * 60 * 24));
              let uyariClass = farkGun <= 5 ? 'text-danger fw-bold' : '';
              let uyariIkon = farkGun <= 5 ? '<i class="fas fa-exclamation-triangle text-danger me-1" title="Yaklaşan Ödeme!"></i>' : '';

              bTbody.innerHTML += `<tr><td><span class="fw-bold">${vergi.tur}</span></td><td>${vergi.donem}</td><td class="${uyariClass}">${uyariIkon}${vergi.sonTarih}</td><td class="fw-bold">${vergi.tutar.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ₺</td><td><span class="badge bg-danger">Bekliyor</span></td>
              <td><button class="btn btn-sm btn-success py-0 me-1" onclick="vergiOdeAc('${vergi.id}')"><i class="fas fa-check"></i> Öde</button><button class="btn btn-sm btn-outline-primary py-0 me-1" onclick="vergiDuzenleAc('${vergi.id}')"><i class="fas fa-edit"></i></button><button class="btn btn-sm btn-outline-danger py-0" onclick="vergiSil('${vergi.id}')"><i class="fas fa-trash"></i></button></td></tr>`;
          } else {
              let bnk = bankaListesi.find(b => b.id === vergi.odenenBankaId)?.hesapAdi || 'Belirsiz Kasa';
              oTbody.innerHTML += `<tr><td><span class="fw-bold">${vergi.tur}</span></td><td>${vergi.donem}</td><td>${vergi.sonTarih}</td><td class="fw-bold text-success">${vergi.tutar.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ₺</td><td><span class="badge bg-success">Ödendi</span><br><small class="text-muted">${bnk}</small></td>
              <td><button class="btn btn-sm btn-outline-danger py-0" onclick="vergiSil('${vergi.id}', true)"><i class="fas fa-trash"></i></button></td></tr>`;
          }
      });
      if(bTbody.innerHTML === '') bTbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted small">Bekleyen vergi bulunmuyor.</td></tr>';
      if(oTbody.innerHTML === '') oTbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted small">Ödenmiş vergi bulunmuyor.</td></tr>';
  };

  window.doprinosiOtomatikEkle = function() {
      let bugun = new Date();
      let ay = bugun.getMonth() + 1;
      let yil = bugun.getFullYear();
      let donemStr = yil + "-" + String(ay).padStart(2, '0');
      
      // Türkiye'de SGK/Muhtasar sonraki ayın 26'sına kadar ödenir
      let gelecekAy = new Date(yil, bugun.getMonth() + 1, 26); 
      let sonTarihStr = gelecekAy.toISOString().split('T')[0];

      document.getElementById('yeniVergiForm').reset(); 
      document.getElementById('v_id').value = '';
      document.getElementById('v_tur').value = 'SGK Primi / Muhtasar';
      document.getElementById('v_donem').value = donemStr;
      document.getElementById('v_sonTarih').value = sonTarihStr;
      document.getElementById('v_tutar').value = 0; // Tutar manuel girilecek

      new bootstrap.Modal(document.getElementById('yeniVergiModal')).show();
  };

  window.vergiModalAc = function() {
      document.getElementById('yeniVergiForm').reset(); document.getElementById('v_id').value = '';
      new bootstrap.Modal(document.getElementById('yeniVergiModal')).show();
  };

  window.vergiDuzenleAc = function(id) {
      const v = vergiListesi.find(x => x.id === id);
      document.getElementById('v_id').value = v.id; document.getElementById('v_tur').value = v.tur; document.getElementById('v_donem').value = v.donem;
      document.getElementById('v_sonTarih').value = v.sonTarih; document.getElementById('v_tutar').value = v.tutar;
      new bootstrap.Modal(document.getElementById('yeniVergiModal')).show();
  };

  window.vergiKaydet = async function() {
      const id = document.getElementById('v_id').value; const tur = document.getElementById('v_tur').value; const donem = document.getElementById('v_donem').value;
      const sonTarih = document.getElementById('v_sonTarih').value; const tutar = parseFloat(document.getElementById('v_tutar').value) || 0;
      if(!tur || !donem || tutar <= 0) return;
      try {
          if(id) await updateDoc(doc(db, "vergiler", id), { tur: tur, donem: donem, sonTarih: sonTarih, tutar: tutar });
          else await addDoc(collection(db, "vergiler"), { tur: tur, donem: donem, sonTarih: sonTarih, tutar: tutar, durum: 'Bekliyor', islemTarihi: serverTimestamp() });
          let m = bootstrap.Modal.getInstance(document.getElementById('yeniVergiModal')); if(m) m.hide();
          
          // Ekranda güncellemeyi zorla
          if (document.getElementById('bekleyenVergiTabloGövdesi')) { window.vergileriCiz(); }

  window.aiRaporAnalizEt = async function(satis, alim, kar, giris, cikis, nakit, bas, bit) {
      const apiKey = localStorage.getItem("ev_gemini_api_key");
      if(!apiKey) { alert("Yapay Zeka API anahtarınız girilmemiş. Lütfen AI Mevzuat Asistanı sekmesinden anahtarı bir kez kaydedin."); return; }

      const kutu = document.getElementById('ai_rapor_analiz_kutusu');
      kutu.innerHTML = '<div class="text-center py-4"><i class="fas fa-spinner fa-spin fa-2x text-primary mb-3"></i><p class="text-muted fw-bold">Finansal verileriniz analiz ediliyor...</p></div>';

      const prompt = `Sen CPA FTC şirketinin CFO'su ve Finansal Danışmanısın. Aşağıdaki verileri inceleyerek, şirket ortaklarına sunulmak üzere profesyonel, kısa ve net bir finansal analiz (Yönetici Özeti) yaz. Rakamları yorumla, Kârlılık (P&L) ile Nakit Akışı (Cash Flow) arasındaki farka dikkat çek ve şirketin gidişatı hakkında 2 cümlelik somut bir tavsiye ver. Gereksiz uzatma. HTML veya Markdown kullanma, düz metin yaz ama önemli yerlerde bold etiketini (<b>) kullan.
      
      Dönem: ${bas} / ${bit}
      Kestiğimiz Faturalar (Ciro): ${satis} EUR
      Gider Faturaları: ${alim} EUR
      Kağıt Üstündeki Kâr: ${kar} EUR
      Kasaya Giren Nakit: ${giris} EUR
      Kasadan Çıkan Nakit: ${cikis} EUR
      Nakit Akışı (Gerçek Kalan): ${nakit} EUR`;

      try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=`+apiKey, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await response.json();
          if(data.error) throw new Error(data.error.message);

          let cevap = data.candidates[0].content.parts[0].text;
          cevap = cevap.replace(/\n/g, '<br>');
          
          kutu.innerHTML = `
              <h6 class="fw-bold text-dark border-bottom pb-2 mb-3"><i class="fas fa-robot text-warning me-2 d-print-none"></i>Yönetim Kurulu Finansal Özeti</h6>
              <div style="font-size: 13px; color: #334155; line-height: 1.6;">${cevap}</div>
          `;
      } catch(e) { 
          kutu.innerHTML = `<div class="alert alert-danger mb-0">AI Hatası: ${e.message}</div>`;
      }
  };

  window.aiGecmisCiz = function() {
      const ekran = document.getElementById('ai_cevap_ekrani');
      if(!ekran) return;
      let html = ``;
      
      aiGecmisListesi.forEach(g => {
          let d = g.tarih ? new Date(g.tarih.seconds * 1000).toLocaleString('tr-TR') : '';
          html += `<div class="mb-3 text-end"><span class="bg-primary text-white p-2 rounded-3 d-inline-block shadow-sm text-start" style="max-width: 85%;"><strong>Siz (${d}):</strong><br>${g.soru}</span></div>`;
          html += `<div class="mb-4 text-start"><span class="bg-white text-dark p-3 rounded-3 d-inline-block border shadow-sm" style="max-width: 90%;"><i class="fas fa-robot text-primary mb-2"></i> <strong>CPA FTC AI Danışmanı:</strong><br>${g.cevap}</span></div>`;
      });
      ekran.innerHTML = html;
      ekran.scrollTop = ekran.scrollHeight;
  };

  window.geminiSoruSor = async function(otomatikMi = false) {
      const apiKey = localStorage.getItem("ev_gemini_api_key");
      const soru = document.getElementById('ai_soru').value;
      
      if(!apiKey) { alert("Lütfen API Anahtarınızı girin."); return; }
      if(soru.trim() === "") { alert("Lütfen bir soru yazın."); return; }

      const btn = document.getElementById('ai_soru_buton');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> İşleniyor'; btn.disabled = true;
      document.getElementById('ai_soru').value = ""; 

      // AI Uzmanlık Kimliği (System Prompt)
      const bugunTarihi = new Date().toLocaleDateString('tr-TR');
      const systemPrompt = `Sen CPA FTC KURUMSAL KAYNAK YÖNETİMİ VE DIŞ TİCARET LTD.ŞTİ. firmasının Türkiye mali mevzuatına (VUK, KDV Kanunu, Kurumlar Vergisi), dış ticaret mevzuatına ve SGK iş kanunlarına hakim kıdemli yapay zeka Mali Müşaviri ve Finans Direktörüsün (CFO). Bugünün tarihi: ${bugunTarihi}. Lütfen tüm hesaplamalarında ve mevzuat yorumlarında güncel Türkiye vergi dilimlerini, güncel asgari ücret tutarlarını ve güncel mevzuat tebliğlerini daima dikkate al. Kullanıcının sorusuna profesyonel, net, anlaşılır ve dış ticarete uygun bir dille cevap ver. Gereksiz uzatma, detayları maddeler halinde özetle.\n\nKullanıcının Sorusu: `;
      const gonderilecekMetin = systemPrompt + soru;

      try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: gonderilecekMetin }] }] })
          });
          const data = await response.json();
          if(data.error) {
              if(data.error.code === 503) throw new Error("Google Yapay Zeka sunucuları şu an yüksek yoğunluk yaşıyor. Lütfen 1 dakika bekleyip sorunuzu tekrar gönderin.");
              else throw new Error(data.error.message);
          }

          let cevapMetni = data.candidates[0].content.parts[0].text;
          cevapMetni = cevapMetni.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

          await addDoc(collection(db, "aiGecmis"), {
              soru: otomatikMi ? "Sistem: Türkiye Gündemini Tara" : soru,
              cevap: cevapMetni,
              tarih: serverTimestamp()
          });
      } catch(error) { alert("AI Asistanı Uyarısı: " + error.message); } 
      finally { btn.innerHTML = '<i class="fas fa-paper-plane me-1"></i> Gönder'; btn.disabled = false; }
  };
</script>
